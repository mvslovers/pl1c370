schema = 3

[project]
name    = "pl1c370"
version = "0.4.0-dev"
# A library: a plain mbt build writes only the run time archive
# (build/pl1rt.a), the release asset.  tests/run_mvs.py builds the test
# modules with mbt build --all.
kind    = "library"

# The run time is built with these.  Moving either pin gives a new pl1rt.a,
# and so a pl1c370 release: the archive carries their code and conventions.
[toolchain]
mbt     = "3.0"
cc370   = "1.6.3"
libc370 = "2.15.0"

# The run time, linked into every PL/I program: private to the test
# modules here ([internal]), published as pl1rt.a with the ABI header
# ([lib]).
[internal]
sources = ["rt/*.c", "rt/*.asm"]

[lib]
name    = "pl1rt"
sources = ["rt/*.c", "rt/*.asm"]
headers = ["rt/pl1abi.h"]

# Seam test: hand-written target code, see tests/mvs/seam/seam0.asm.
[module.P0HELLO]
sources = ["tests/mvs/seam/seam0.asm"]
rent    = false
reus    = false

# CHELLO, CHELLOS: a C program's start-up on LIBC/370 alone, with the
# default stack and with 16 KB, measured against PL/I (F) and PL1C/370
# for #177 (internals/research/pli/startup-measurement.md).
[module.CHELLO]
sources = ["tests/mvs/chello/chello.c"]
rent    = false
reus    = false

[module.CHELLOS]
sources = ["tests/mvs/chello/chellos.c"]
rent    = false
reus    = false

# XDRIVER: calls an external REXX function as TSO/E REXX does, for the
# tests with a <name>.xdrv (tests/mvs/xdriver/xdriver.asm).
[module.XDRIVER]
sources = ["tests/mvs/xdriver/xdriver.asm"]
entry   = "XDRIVER"                # assembler, no C startup
rent    = false
reus    = false

# ASMTST: an assembler routine the OPTIONS(ASSEMBLER) tests call, here
# for PL/I (F)'s link-edit to find by autocall (tests/mvs/asmsub).
[module.ASMTST]
sources = ["tests/mvs/asmsub/asmtst.asm"]
entry   = "ASMTST"
rent    = false
reus    = false

[module.ASMVAL]
sources = ["tests/mvs/asmsub/asmval.asm"]
entry   = "ASMVAL"
rent    = false
reus    = false

# Programs compiled by PL1C/370 from tests/pli/*.pli, compared with PL/I (F)
# on MVS.  tests/run_mvs.py rewrites this block.

# BEGIN TESTS (tests/run_mvs.py)

