# A tag v<version> (the version of mbt.toml) gives a GitHub release with
# the host compiler for Linux and macOS and the run time (pl1rt.a with
# rt/pl1abi.h) built from the same commit, and their SHA256SUMS.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  host:
    uses: ./.github/workflows/host.yml

  rt:
    uses: ./.github/workflows/rt.yml

  release:
    needs: [host, rt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches mbt.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version *= *"\(.*\)"/\1/p' mbt.toml | head -1)
          if [ "$have" != "$want" ]; then
            echo "::error::mbt.toml has version '$have', the tag says '$want'"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: pl1c370-*
          path: assets
          merge-multiple: true

      - name: SHA256SUMS
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease \
                       -q '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null); then
            if [ "$state" = "false false" ]; then
              echo "::error::$GITHUB_REF_NAME is released; its assets are not replaced"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$GITHUB_REF_NAME" $pre \
              --title "PL1C/370 $GITHUB_REF_NAME" --generate-notes assets/*
          fi
